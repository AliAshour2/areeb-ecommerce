@if (message()) {
    <div
      class="fixed top-6 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 w-fit min-w-[280px] max-w-[90%] px-5 py-4 rounded-xl shadow-lg transition-all duration-300 border backdrop-blur-md"
      [ngClass]="{
        'bg-gradient-to-r from-green-50 to-green-100 text-green-900 border-green-300': type() === 'success',
        'bg-gradient-to-r from-red-50 to-red-100 text-red-900 border-red-300': type() === 'error',
        'bg-gradient-to-r from-gray-100 to-gray-200 text-gray-800 border-gray-300': type() === 'loading'
      }"
    >
  
      <!-- ✅ Success Icon -->
      @if (type() === 'success') {
        <i class="fa-solid fa-check text-green-600"></i>
      }
  
      <!-- ❌ Error Icon -->
      @if (type() === 'error') {
        <i class="fa-solid fa-circle-exclamation "></i>
      }
  
      <!-- ⏳ Loading Spinner -->
      @if (type() === 'loading') {
        <i class="fa-duotone fa-solid fa-spinner fa-spin-pulse"></i>
      }
  
      <!-- ✉️ Message Content -->
      <span class="text-sm font-medium leading-tight">
        {{ message() }}
      </span>
  
    </div>
  }
