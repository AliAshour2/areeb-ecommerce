@if (message()) {
    <div
      class="fixed top-6 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 w-fit min-w-[280px] max-w-[90%] px-5 py-4 rounded-xl shadow-lg transition-all duration-300 border backdrop-blur-md"
      [ngClass]="{
        'bg-gradient-to-r from-green-50 to-green-100 text-green-900 border-green-300': type() === 'success',
        'bg-gradient-to-r from-red-50 to-red-100 text-red-900 border-red-300': type() === 'error',
        'bg-gradient-to-r from-gray-100 to-gray-200 text-gray-800 border-gray-300': type() === 'loading'
      }"
    >
  
      <!-- ✅ Success Icon -->
      @if (type() === 'success') {
        <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" stroke-width="2"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      }
  
      <!-- ❌ Error Icon -->
      @if (type() === 'error') {
        <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" stroke-width="2"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      }
  
      <!-- ⏳ Loading Spinner -->
      @if (type() === 'loading') {
        <svg class="w-5 h-5 text-gray-600 animate-spin" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
        </svg>
      }
  
      <!-- ✉️ Message Content -->
      <span class="text-sm font-medium leading-tight">
        {{ message() }}
      </span>
  
    </div>
  }
