<button
  [type]="type()"
  class="w-full flex justify-center items-center gap-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold py-3.5 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed transform hover:scale-[1.02]"
  [disabled]="disabled() || loading()"
>
  @if (loading()) {
    <svg class="animate-spin h-5 w-5 text-white" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4l3-3-3-3v4a8 8 0 100 16v-4l-3 3 3 3v-4a8 8 0 01-8-8z"/>
    </svg>
    <span class="ml-2">Loading...</span>
  } @else {
    <ng-content></ng-content>
    <span>{{ label() }}</span>
  }
</button>
