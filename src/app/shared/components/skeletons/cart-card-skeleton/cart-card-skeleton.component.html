<div
  class="bg-white rounded-xl shadow-sm p-6 mb-4 border border-gray-100 relative overflow-hidden animate-pulse"
>
  <div class="flex flex-row gap-6 items-center">
    <!-- Image Skeleton -->
    <div class="flex-shrink-0">
      <div class="w-24 h-24 sm:w-28 sm:h-28 bg-gray-200 rounded-lg"></div>
    </div>

    <!-- Info Section -->
    <div class="flex-grow min-w-0 space-y-3">
      <!-- Brand badge -->
      <div class="w-24 h-5 bg-gray-200 rounded-full"></div>

      <!-- Title -->
      <div class="h-6 w-3/4 bg-gray-300 rounded"></div>

      <!-- Category & Rating -->
      <div class="flex items-center gap-4">
        <div class="w-20 h-4 bg-gray-200 rounded"></div>
        <div class="flex gap-1">
          <div class="h-3 w-3 bg-gray-200 rounded-full" *ngFor="let i of [1,2,3,4,5]"></div>
        </div>
      </div>

      <!-- Stock -->
      <div class="flex items-center gap-2">
        <div class="w-24 h-5 bg-gray-200 rounded-full"></div>
        <div class="w-10 h-4 bg-gray-200 rounded"></div>
      </div>
    </div>

    <!-- Price & Actions -->
    <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4 flex-shrink-0">
      <!-- Quantity Controls -->
      <div class="flex items-center bg-gray-100 rounded-lg p-1 gap-2">
        <div class="w-8 h-8 bg-gray-200 rounded-md"></div>
        <div class="w-6 h-6 bg-gray-300 rounded"></div>
        <div class="w-8 h-8 bg-gray-200 rounded-md"></div>
      </div>

      <!-- Price Info -->
      <div class="space-y-1 text-right">
        <div class="h-4 w-16 bg-gray-200 rounded"></div>
        <div class="h-6 w-20 bg-gray-300 rounded"></div>
        <div class="h-4 w-24 bg-gray-200 rounded"></div>
      </div>

      <!-- Remove Button -->
      <div class="w-10 h-10 bg-gray-100 rounded-full"></div>
    </div>
  </div>

  <!-- Bottom bar -->
  <div class="flex justify-between items-center pt-4 mt-4 border-t border-gray-100">
    <div class="flex gap-4">
      <div class="w-16 h-4 bg-gray-200 rounded"></div>
      <div class="w-16 h-4 bg-gray-200 rounded"></div>
    </div>
    <div class="w-24 h-3 bg-gray-100 rounded"></div>
  </div>
</div>
