<div
  class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-indigo-100 flex items-center justify-center p-4"
>
  <div class="w-full max-w-[450px]">
    <form
      [formGroup]="signUpForm"
      (ngSubmit)="onSubmit()"
      class="bg-white rounded-3xl shadow-2xl p-8 space-y-6 border border-gray-100"
    >
      <main>
        <!-- Heading -->
        <div class="text-center mb-8">
          <div
            class="w-16 h-16 bg-gradient-to-r from-blue-500 to-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 icon-container"
          >
            <svg
              class="w-8 h-8 text-white"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              ></path>
            </svg>
          </div>
          <h2 class="text-3xl font-bold text-gray-900 mb-2">Create Account</h2>
          <p class="text-gray-600">Join us and start your amazing journey!</p>
        </div>
        <!-- Input Fields -->
        <div class="space-y-2">
          <app-input-field
            id="name"
            label="Name"
            [type]="InputType.Text"
            placeholder="Enter Your Name"
            [control]="signUpForm.controls.name"
          ></app-input-field>
          <app-input-field
            id="email"
            label="Email"
            [type]="InputType.Email"
            placeholder="Enter your email"
            [control]="signUpForm.controls.email"
          ></app-input-field>

          <app-input-field
            id="password"
            label="Password"
            [type]="InputType.Password"
            placeholder="Enter Your password"
            [control]="signUpForm.controls.password"
          >
          </app-input-field>

          <app-input-field
            id="repassword"
            label="Re-Password"
            [type]="InputType.Password"
            placeholder="Enter Your Password Again"
            [control]="signUpForm.controls.rePassword"
          >
          </app-input-field>

          <app-input-field
            id="phone"
            label="Phone"
            [type]="InputType.Tel"
            placeholder="Enter your phone number"
            [control]="signUpForm.controls.phone"
          ></app-input-field>
        </div>

        <!-- Submit Button -->
        <div class="pt-4">
          <button
            type="submit"
            class="w-full flex justify-center items-center gap-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold py-3.5 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed transform hover:scale-[1.02] submit-btn"
            [disabled]="!signUpForm.valid || isLoading()"
          >
            @if (isLoading()) {
            <svg class="animate-spin h-5 w-5 text-white" viewBox="0 0 24 24">
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8v4l3-3-3-3v4a8 8 0 100 16v-4l-3 3 3 3v-4a8 8 0 01-8-8z"
              />
            </svg>
            <span>Creating Account...</span>
            } @else {
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"
              ></path>
            </svg>
            <span>Create Account</span>
            }
          </button>
        </div>

        <!-- Divider -->
        <div class="relative my-4">
          <div class="absolute inset-0 flex items-center">
            <span class="w-full border-t border-gray-200"></span>
          </div>
          <div class="relative flex justify-center text-sm uppercase">
            <span class="bg-white px-xs text-gray-500 font-light"
              >or continue with</span
            >
          </div>
        </div>

        <!-- Google Sign In -->
        <button
          type="button"
          class="w-full flex justify-center items-center gap-3 bg-white hover:bg-gray-50 text-gray-700 font-medium py-3.5 rounded-xl border-2 border-gray-200 hover:border-gray-300 transition-all duration-300 shadow-sm hover:shadow-md google-btn"
        >
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path
              fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            />
            <path
              fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            />
            <path
              fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
            />
            <path
              fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            />
          </svg>
          <span>Sign up with Google</span>
        </button>

        <!-- Sign In Link -->
        <div class="text-center mt-8 pt-6 border-t border-gray-100">
          <p class="text-gray-600">
            Already have an account?
            <a
              href="/signin"
              class="text-blue-600 hover:text-blue-700 font-semibold ml-1 transition-colors duration-200 hover:underline"
            >
              Sign in here
            </a>
          </p>
        </div>
      </main>
    </form>
  </div>
</div>
