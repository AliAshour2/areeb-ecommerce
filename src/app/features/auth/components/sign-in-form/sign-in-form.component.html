<div
  class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-indigo-100 flex items-center justify-center p-4"
>
  <div class="w-full max-w-[450px]">
    <form
      [formGroup]="signInForm"
      (ngSubmit)="onSubmit()"
      class="bg-white rounded-3xl shadow-2xl p-8 space-y-6 border border-gray-100"
    >
      <main>
        <!-- Heading -->
        <div class="text-center mb-8">
          <div
            class="w-16 h-16 bg-gradient-to-r from-blue-500 to-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 icon-container"
          >
            <svg
              class="w-8 h-8 text-white"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              ></path>
            </svg>
          </div>
          <h2 class="text-3xl font-bold text-gray-900 mb-2">Create Account</h2>
          <p class="text-gray-600">Join us and start your amazing journey!</p>
        </div>
        <!-- Input Fields -->
        <div class="flex flex-col space-y-md mb-sm">
          <app-input-field
            id="email"
            label="Email"
            [type]="InputType.Email"
            placeholder="Enter your email"
            [control]="signInForm.controls.email"
          ></app-input-field>

          <app-input-field
            id="password"
            label="Password"
            [type]="InputType.Password"
            placeholder="Enter Your password"
            [control]="signInForm.controls.password"
          >
          </app-input-field>
        </div>

        <!-- Submit Button -->
        <app-button
          type="submit"
          label="Sign In"     
          [disabled]="!signInForm.valid || isLoading()"
          [loading]="isLoading()"
          class="mt-sm"
        ></app-button>

        <!-- Divider -->
        <div class="relative my-4">
          <div class="absolute inset-0 flex items-center">
            <span class="w-full border-t border-gray-200"></span>
          </div>
          <div class="relative flex justify-center text-sm uppercase">
            <span class="bg-white px-xs text-gray-500 font-light"
              >or continue with</span
            >
          </div>
        </div>

        <!-- Google Sign In -->
        <app-google-button [label]="'Sign in with Google'"></app-google-button>

        <!-- Sign In Link -->
        <div class="text-center mt-8 pt-6 border-t border-gray-100">
          <p class="text-gray-600">
            Don't have Account
            <a
              href="/signin"
              class="text-blue-600 hover:text-blue-700 font-semibold ml-1 transition-colors duration-200 hover:underline"
            >
              Sign up here
            </a>
          </p>
        </div>
      </main>
    </form>
  </div>
</div>
