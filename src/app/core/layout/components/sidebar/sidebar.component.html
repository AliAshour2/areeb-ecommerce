<aside [ngClass]="sidebarClasses()" class="min-h-screen bg-main px-lg py-md font-sans text-primary p-base transition-all duration-300">
    <div class="flex items-center justify-between mb-lg">
      <h1 class="leading-lg font-medium text-base" [class.hidden]="isCollapsed()">
        Fashion Hub
      </h1>
      <button (click)="toggleSidebar()" class="p-2 rounded-md hover:bg-surface focus:outline-none">
        <i [class]="isCollapsed() ? 'fas fa-bars' : 'fas fa-times'" class="text-lg"></i>
      </button>
    </div>
  
    <nav class="flex flex-col gap-sm">
      <!-- Home -->
      <a routerLink="/products"
        class="flex items-center gap-sm py-sm px-sm text-sm fw-medium rounded-full hover:bg-surface">
        <i class="fas fa-home mr-2"></i>
        <span [class.hidden]="isCollapsed()">Home</span>
      </a>
  
      <!-- Shop (Active) -->
      <a routerLink="/developers"
        class="flex items-center gap-sm py-sm px-sm text-sm fw-medium rounded-full hover:bg-surface">
        <i class="fas fa-store mr-2"></i>
        <span [class.hidden]="isCollapsed()">Shop</span>
      </a>
  
      <!-- About -->
      <a routerLink="/cart" class="flex items-center gap-sm py-sm px-sm text-sm fw-medium rounded-full hover:bg-surface">
        <i class="fas fa-info-circle mr-2"></i>
        <span [class.hidden]="isCollapsed()">About</span>
      </a>
  
      <!-- Contact -->
      <a routerLink="/content" class="flex items-center gap-sm py-sm px-sm text-sm fw-medium rounded-full hover:bg-surface">
        <i class="fas fa-envelope mr-2"></i>
        <span [class.hidden]="isCollapsed()">Content</span>
      </a>
  
      <!-- Blog -->
      <a routerLink="/blog" class="flex items-center gap-sm py-sm px-sm text-sm fw-medium rounded-full hover:bg-surface">
        <i class="fas fa-blog mr-2"></i>
        <span [class.hidden]="isCollapsed()">Blog</span>
      </a>
    </nav>
  </aside>
